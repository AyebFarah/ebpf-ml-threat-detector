name: CI

on:
  push:
  pull_request:

jobs:
  tests_and_migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest observation/tests -q

      - name: Verify migrations build a clean database
        env:
          OBSERVATION_DB_PATH: /tmp/ci_check.db
        run: |
          rm -f "$OBSERVATION_DB_PATH"
          alembic upgrade head
          test -f "$OBSERVATION_DB_PATH"
          alembic check

      - name: Check models match latest migration
        run: alembic check
